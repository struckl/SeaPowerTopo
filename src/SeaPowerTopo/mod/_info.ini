Name=Sea Power Topographic Map
Description=Land heights and sea depths on the tactical map: height-coloured land with hill shading and contour lines, the sea tinted by depth, the height or depth under the cursor, and terrain above the selected aircraft's altitude in red. 17 looks, light and dark – Atlas, army map, ECDIS chart, radar green, thermal and more – in a picker next to the legend. Toggle it in the map's Layers menu or with F6. Requires Anchor Chain.

