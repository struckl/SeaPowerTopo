[Language_en]
Name=Sea Power Topographic Map
Description=Land heights and sea depths on the tactical map: height-coloured land with hill shading and contour lines, the sea tinted by depth, the height or depth under the cursor, and terrain above the selected aircraft's altitude in red. 11 looks, light and dark, and your own from theme files – army map, ECDIS chart, combat display, radar green and more. Its buttons sit in the map's title bar: Topography on/off, the look, the legend, the cursor readout on/off; also in the mission editor. Works on the current flat map (0.8.7) and on the new 3D globe map (public beta, the November release). Requires Anchor Chain.

