[Language_en]
Name=R.A.T.S. Topographic Map
Description=Land heights and sea depths on the tactical map: height-coloured land with hill shading and contour lines, the sea tinted by depth, the height or depth under the cursor, and terrain above the selected aircraft's altitude in red. 19 looks, light and dark, and your own from theme files – Soviet General Staff map, satellite, bathymetric chart, survey sonar, ECDIS chart, combat display and more. Its buttons sit in the map's title bar: Topography on/off, the look, the legend, the cursor readout on/off; also in the mission editor. Works on the current flat map (0.8.7) and on the new 3D globe map (public beta, the November release). Requires Anchor Chain.

[Compatibility]
GreaterThanEqualToVersion=0.8.7
LessThanVersion=0.10.0
